<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # So the files in /someproject/ can also be reached under /v2/someproject/ - useful during development to bypass chaches.
    RewriteEngine On
    RewriteRule ^/v[0-9]+/(.*)$ /$1 [PT,L]

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
        Options +FollowSymLinks
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
